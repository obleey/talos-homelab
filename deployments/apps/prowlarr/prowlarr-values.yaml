fullnameOverride: prowlarr

controllers:
  main:
    type: deployment
    strategy: Recreate
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.7.0.5723-ls166
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Ljubljana
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: prowlarr-config
    globalMounts:
      - path: /config

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'Prowlarr'
      gethomepage.dev/icon: 'prowlarr.png'
      gethomepage.dev/description: 'Indexers'
      gethomepage.dev/weight: '300'
      gethomepage.dev/widget.type: 'prowlarr'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}" }}'
