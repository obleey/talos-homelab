fullnameOverride: radarr

controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: 6.4.4.10685-ls324
        env:
          PUID: "1000"
          PGID: "1000"
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /
          startup:
            enabled: true
            type: TCP

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: radarr-config
    globalMounts:
      - path: /config
  data:
    type: persistentVolumeClaim
    existingClaim: starr-data
    globalMounts:
      - path: /data

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'Radarr'
      gethomepage.dev/icon: 'radarr.png'
      gethomepage.dev/description: 'Movies'
      gethomepage.dev/weight: '100'
      gethomepage.dev/widget.type: 'radarr'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_RADARR_API_KEY}}" }}'
