controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: technitium/dns-server
          tag: '15.6.2'
        env:
          DNS_SERVER_DOMAIN: dns02.dns.local
    pod:
      hostAliases:
        - ip: 10.0.0.104
          hostnames:
            - dns01.dns.local

service:
  app:
    forceRename: technitium-secondary
  # stable LAN address for DNS and the cluster link to dns01 (Technitium cluster node IP)
  dns:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    forceRename: technitium-secondary-dns
    annotations:
      io.cilium/lb-ipam-ips: "10.0.0.201"
    ports:
      dns-udp:
        port: 53
        protocol: UDP
      dns-tcp:
        port: 53
        protocol: TCP
      admin-https:
        port: 53443
        protocol: TCP
      admin-http:
        port: 5380
        protocol: TCP

persistence:
  config:
    globalMounts:
      - path: /etc/dns

route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Infrastructure'
      gethomepage.dev/name: 'Technitium Secondary'
      gethomepage.dev/icon: 'technitium.png'
      gethomepage.dev/description: 'DNS server (secondary)'
      gethomepage.dev/weight: '150'
      gethomepage.dev/widget.type: 'technitium'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_TECHNITIUM_API_KEY}}" }}'
