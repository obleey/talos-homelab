fullnameOverride: byparr

controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: ghcr.io/thephaseless/byparr
          tag: latest@sha256:c66fa161187b8fa527bfad7eefa2647ea1c553f77df68cbffd6fe83366d1787b
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

service:
  app:
    controller: main
    ports:
      http:
        port: 8191

persistence:
  config:
    enabled: false
