fullnameOverride: plex

controllers:
  main:
    type: deployment
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos-worker-1
    containers:
      main:
        image:
          repository: plexinc/pms-docker
          tag: "1.43.5.11079-b3b13e506"
        env:
          HOSTNAME: talos-plex
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi

persistence:
  config:
    forceRename: pms-config-plex-plex-media-server-0
    size: 20Gi
  cache:
    type: persistentVolumeClaim
    forceRename: plex-cache
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 20Gi
    globalMounts:
      - path: /caches
  transcode:
    type: persistentVolumeClaim
    forceRename: plex-transcode
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /transcodes
  dri:
    type: hostPath
    hostPath: /dev/dri
    globalMounts:
      - path: /dev/dri
  data:
    type: persistentVolumeClaim
    existingClaim: starr-data
    globalMounts:
      - path: /data

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Servers'
      gethomepage.dev/name: 'Plex'
      gethomepage.dev/icon: 'plex.png'
      gethomepage.dev/description: 'Media server'
      gethomepage.dev/href: 'https://app.plex.tv'
      gethomepage.dev/weight: '100'
      gethomepage.dev/widget.type: 'plex'
      gethomepage.dev/widget.url: 'http://10.0.0.161:32400'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_PLEX_TOKEN}}" }}'
