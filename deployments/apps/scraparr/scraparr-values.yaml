fullnameOverride: scraparr

controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: ghcr.io/thecfu/scraparr
          tag: "3.2.0"
        env:
          SONARR_URL: http://sonarr.servarr.svc.cluster.local:8989
          RADARR_URL: http://radarr.servarr.svc.cluster.local:7878
          PROWLARR_URL: http://prowlarr.servarr.svc.cluster.local:9696
          BAZARR_URL: http://bazarr.servarr.svc.cluster.local:6767
          JELLYSEERR_URL: http://seerr.servarr.svc.cluster.local:5055
          SONARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: sonarr-api-key
          RADARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: radarr-api-key
          PROWLARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: prowlarr-api-key
          BAZARR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: bazarr-api-key
          JELLYSEERR_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: seerr-api-key
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

service:
  app:
    controller: main
    ports:
      http:
        port: 7100

serviceMonitor:
  app:
    serviceName: scraparr
    endpoints:
      - port: http
        path: /metrics
        interval: 1m

persistence:
  config:
    enabled: false
