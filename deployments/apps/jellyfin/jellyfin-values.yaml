fullnameOverride: jellyfin

controllers:
  main:
    type: deployment
    strategy: Recreate
    pod:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: talos-worker-1
    containers:
      main:
        image:
          repository: jellyfin/jellyfin
          tag: "12.4.20261026-211555"
        env:
          TZ: Europe/Ljubljana
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            memory: 4Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /health
          readiness:
            enabled: true
            type: HTTP
            path: /health
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5

persistence:
  dri:
    type: hostPath
    hostPath: /dev/dri
    globalMounts:
      - path: /dev/dri
  config:
    type: persistentVolumeClaim
    existingClaim: jellyfin-config
    globalMounts:
      - path: /config
  cache:
    type: persistentVolumeClaim
    existingClaim: jellyfin-cache
    globalMounts:
      - path: /cache
  media:
    type: nfs
    server: 10.0.0.104
    path: /mnt/serve/starr-stack/data/media
    globalMounts:
      - path: /data/media

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Servers'
      gethomepage.dev/name: 'Jellyfin'
      gethomepage.dev/icon: 'jellyfin.png'
      gethomepage.dev/description: 'Media server'
      gethomepage.dev/weight: '200'
      gethomepage.dev/widget.type: 'jellyfin'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}" }}'
      gethomepage.dev/widget.enableBlocks: 'true'
      gethomepage.dev/widget.enableNowPlaying: 'true'
