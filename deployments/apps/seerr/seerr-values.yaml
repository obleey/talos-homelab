fullnameOverride: seerr

controllers:
  main:
    type: deployment
    pod:
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
    containers:
      main:
        image:
          repository: ghcr.io/seerr-team/seerr
          tag: v3.5.1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /
          startup:
            enabled: true
            type: TCP

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: seerr-config
    globalMounts:
      - path: /app/config

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'Seerr'
      gethomepage.dev/icon: 'seerr.png'
      gethomepage.dev/description: 'Media requests'
      gethomepage.dev/weight: '500'
      gethomepage.dev/widget.type: 'seerr'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_SEERR_API_KEY}}" }}'
