fullnameOverride: watchstate

controllers:
  main:
    type: deployment
    strategy: Recreate
    pod:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
    containers:
      main:
        image:
          repository: ghcr.io/arabcoders/watchstate
          tag: v1.10.10
        env:
          TZ: Europe/Ljubljana
          WS_TZ: Europe/Ljubljana
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: watchstate-config
    globalMounts:
      - path: /config

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'WatchState'
      gethomepage.dev/icon: 'mdi-sync'
      gethomepage.dev/description: 'Watch state sync'
      gethomepage.dev/weight: '700'
