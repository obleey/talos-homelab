apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopulse-secret
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: autopulse-secret
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: AUTOPULSE__AUTH__PASSWORD
      remoteRef:
        key: servarr/autopulse-secret
        property: AUTOPULSE__AUTH__PASSWORD
    - secretKey: AUTOPULSE__AUTH__USERNAME
      remoteRef:
        key: servarr/autopulse-secret
        property: AUTOPULSE__AUTH__USERNAME
