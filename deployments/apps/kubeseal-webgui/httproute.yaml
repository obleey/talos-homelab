apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubeseal-webgui
  namespace: kubeseal-webgui
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/pod-selector: 'app=kubeseal-webgui'
    gethomepage.dev/group: 'Infrastructure'
    gethomepage.dev/name: 'Kubeseal'
    gethomepage.dev/icon: 'kubernetes.png'
    gethomepage.dev/description: 'Sealed secrets UI'
    gethomepage.dev/weight: '130'
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "kubeseal.talos-cluster.local.obleey.com"
  rules:
    - backendRefs:
        - name: kubeseal-webgui
          port: 8080
