fullnameOverride: qbittorrent

controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 20.04.1
        env:
          PUID: "1000"
          PGID: "1000"
          WEBUI_PORT: "8080"
          TORRENTING_PORT: "30881"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 2Gi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: qbittorrent-config
    globalMounts:
      - path: /config
  torrents:
    type: persistentVolumeClaim
    existingClaim: starr-data
    globalMounts:
      - path: /data/torrents
        subPath: torrents

service:
  app:
    controller: main
    type: NodePort
    ports:
      # port comes from the appset record
      http:
        primary: true
        protocol: TCP
      torrenting-tcp:
        port: 30881
        protocol: TCP
        nodePort: 30881
      torrenting-udp:
        port: 30881
        protocol: UDP
        nodePort: 30881

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Downloads'
      gethomepage.dev/name: 'qBittorrent'
      gethomepage.dev/icon: 'qbittorrent.png'
      gethomepage.dev/description: 'Torrent client'
      gethomepage.dev/weight: '100'
      gethomepage.dev/widget.type: 'qbittorrent'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.username: '{{ "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}" }}'
      gethomepage.dev/widget.password: '{{ "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}" }}'
