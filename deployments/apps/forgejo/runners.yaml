# Forgejo Actions runners, one job each. Each pod derives its credentials from the shared secret and its
# ordinal, matching what forgejo-values.yaml's register-runners sidecar registers (keep replicas and its
# `for i in 0 1 2` in step). Jobs run in a Docker-in-Docker sidecar and can use docker themselves.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo-runner
  namespace: forgejo
  labels: { app.kubernetes.io/name: forgejo-runner }
spec:
  replicas: 3
  serviceName: forgejo-runner
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app.kubernetes.io/name: forgejo-runner }
  template:
    metadata:
      labels: { app.kubernetes.io/name: forgejo-runner }
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: forgejo-runner }
      initContainers:
        # native sidecar: the runner starts only once the daemon answers
        - name: dind
          image: docker.io/library/docker:29.9.3-dind
          restartPolicy: Always
          securityContext: { privileged: true }
          env:
            - { name: DOCKER_TLS_CERTDIR, value: /certs }
          startupProbe:
            exec: { command: [docker, info] }
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: certs, mountPath: /certs }
            - { name: docker, mountPath: /var/lib/docker }
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.1
          command: [bash, -c]
          args:
            - |
              set -e
              i=${HOSTNAME##*-}
              id=${RUNNER_SECRET:0:14}$(printf %02x "$i")
              hex=$(printf %s "$id" | od -An -tx1 | tr -d ' \n')
              cat > /tmp/config.yml <<EOF
              runner:
                capacity: 1
                labels:
                  - ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-24.04
                  - ubuntu-24.04:docker://ghcr.io/catthehacker/ubuntu:act-24.04
                  - debian-13:docker://node:24-trixie
                envs:
                  DOCKER_HOST: tcp://localhost:2376
                  DOCKER_TLS_VERIFY: "1"
                  DOCKER_CERT_PATH: /certs/client
              container:
                network: host
                options: -v /certs/client:/certs/client
                valid_volumes: [/certs/client]
              server:
                connections:
                  forgejo:
                    url: http://forgejo-http.forgejo.svc.cluster.local:3000/
                    uuid: ${hex:0:8}-${hex:8:4}-${hex:12:4}-${hex:16:4}-${hex:20:12}
                    token: $id${RUNNER_SECRET:16}
              EOF
              exec forgejo-runner daemon --config /tmp/config.yml
          env:
            - { name: DOCKER_HOST, value: tcp://localhost:2376 }
            - { name: DOCKER_TLS_VERIFY, value: '1' }
            - { name: DOCKER_CERT_PATH, value: /certs/client }
            - name: RUNNER_SECRET
              valueFrom: { secretKeyRef: { name: forgejo-runner, key: secret } }
          workingDir: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: certs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: docker
          emptyDir: { sizeLimit: 30Gi }
