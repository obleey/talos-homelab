apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner
  namespace: forgejo
  annotations:
    # before the workloads that read it: ArgoCD waits for it to be healthy (ESO has filled the Secret)
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo-runner
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: secret
      remoteRef:
        key: forgejo/forgejo-runner
        property: secret
