apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-restic
  namespace: forgejo
  annotations:
    # before the workloads that read it: ArgoCD waits for it to be healthy (ESO has filled the Secret)
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: forgejo-restic
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: forgejo/forgejo-restic
        property: RESTIC_PASSWORD
    - secretKey: RESTIC_REPOSITORY
      remoteRef:
        key: forgejo/forgejo-restic
        property: RESTIC_REPOSITORY
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: forgejo/forgejo-restic
        property: SLACK_WEBHOOK_URL
    - secretKey: storagebox.key
      remoteRef:
        key: forgejo/forgejo-restic
        property: storagebox.key
