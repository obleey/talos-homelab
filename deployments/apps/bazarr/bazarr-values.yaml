fullnameOverride: bazarr

controllers:
  main:
    type: deployment
    strategy: Recreate
    containers:
      main:
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: 1.6.2
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: Europe/Ljubljana
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 1Gi
        probes:
          liveness:
            enabled: true
            type: HTTP
            path: /
          readiness:
            enabled: true
            type: HTTP
            path: /
          startup:
            enabled: true
            type: TCP
            spec:
              failureThreshold: 30
              periodSeconds: 5

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: bazarr-config
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 10.0.0.104
    path: /mnt/serve/starr-stack/data
    globalMounts:
      - path: /data

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'Bazarr'
      gethomepage.dev/icon: 'bazarr.png'
      gethomepage.dev/description: 'Subtitles'
      gethomepage.dev/weight: '400'
      gethomepage.dev/widget.type: 'bazarr'
      gethomepage.dev/widget.url: 'http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.app.ports.http.port }}'
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_BAZARR_API_KEY}}" }}'
