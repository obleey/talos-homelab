apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: servarr
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: homepage-secrets
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: HOMEPAGE_VAR_ARGOCD_TOKEN
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_ARGOCD_TOKEN
    - secretKey: HOMEPAGE_VAR_NETBIRD_URL
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_NETBIRD_URL
    - secretKey: HOMEPAGE_VAR_TECHNITIUM_API_KEY
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_TECHNITIUM_API_KEY
    - secretKey: HOMEPAGE_VAR_TRUENAS_API_KEY
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_TRUENAS_API_KEY
    - secretKey: HOMEPAGE_VAR_FORGEJO_TOKEN
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_FORGEJO_TOKEN
    - secretKey: HOMEPAGE_VAR_GRAFANA_USERNAME
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_GRAFANA_USERNAME
    - secretKey: HOMEPAGE_VAR_GRAFANA_PASSWORD
      remoteRef:
        key: servarr/homepage-secrets
        property: HOMEPAGE_VAR_GRAFANA_PASSWORD
