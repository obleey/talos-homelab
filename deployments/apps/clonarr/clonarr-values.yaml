fullnameOverride: clonarr

controllers:
  main:
    type: deployment
    containers:
      main:
        image:
          repository: ghcr.io/prophetse7en/clonarr
          tag: v3.5.0
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true

persistence:
  config:
    size: 5Gi

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Media Management'
      gethomepage.dev/name: 'Clonarr'
      gethomepage.dev/icon: 'https://{{ first .Values.route.app.hostnames }}/icons/clonarr.png'
      gethomepage.dev/description: 'Trash Guides sync'
      gethomepage.dev/weight: '600'
