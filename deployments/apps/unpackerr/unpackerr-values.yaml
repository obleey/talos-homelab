fullnameOverride: unpackerr

controllers:
  main:
    type: deployment
    strategy: Recreate
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    containers:
      main:
        image:
          repository: golift/unpackerr
          tag: v1.0.0
        envFrom:
          - configMapRef:
              name: unpackerr-config
        env:
          UN_SONARR_0_API_KEY:
            valueFrom:
              secretKeyRef:
                name: api-tokens-sealedsecret
                key: sonarr-api-key
          UN_RADARR_0_API_KEY:
            valueFrom:
              secretKeyRef:
                name: api-tokens-sealedsecret
                key: radarr-api-key
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

service:
  app:
    controller: main
    ports:
      http:
        port: 5656

persistence:
  # web UI saves rewrite /config/unpackerr.conf, so it must be writable and persistent
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    retain: true
    globalMounts:
      - path: /config
  torrents:
    type: nfs
    server: 10.0.0.104
    path: /mnt/serve/starr-stack/data/torrents
    globalMounts:
      - path: /data/torrents

configMaps:
  config:
    forceRename: unpackerr-config
    data:
      TZ: Europe/Ljubljana
      UN_LOG_FILE: /data/torrents/unpackerr.log
      UN_SONARR_0_URL: http://sonarr.servarr.svc.cluster.local:8989
      UN_SONARR_0_PATHS_0: /data/torrents
      UN_RADARR_0_URL: http://radarr.servarr.svc.cluster.local:7878
      UN_RADARR_0_PATHS_0: /data/torrents
      UN_PARALLEL: "1"
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "0755"

route:
  app:
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        sectionName: websecure
    hostnames:
      - unpackerr.talos-cluster.local.obleey.com
    rules:
      - backendRefs:
          - name: unpackerr
            port: 5656
