fullnameOverride: unpackerr

controllers:
  main:
    type: deployment
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
    containers:
      main:
        image:
          repository: golift/unpackerr
          tag: v1.0.0
        envFrom:
          - configMapRef:
              name: unpackerr-config
        env:
          UN_SONARR_0_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: sonarr-api-key
          # user:pass, hashed in memory at startup; locks the password field in the UI
          UN_WEBSERVER_UI_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: unpackerr-ui
                key: ui-password
          UN_RADARR_0_API_KEY:
            valueFrom:
              secretKeyRef:
                name: servarr-credentials
                key: radarr-api-key
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

persistence:
  config:
    forceRename: unpackerr
  torrents:
    type: persistentVolumeClaim
    existingClaim: starr-data
    globalMounts:
      - path: /data/torrents
        subPath: torrents

configMaps:
  config:
    forceRename: unpackerr-config
    data:
      TZ: Europe/Ljubljana
      UN_LOG_FILE: /data/torrents/unpackerr.log
      UN_SONARR_0_URL: http://sonarr.servarr.svc.cluster.local:8989
      UN_SONARR_0_PATHS_0: /data/torrents
      UN_RADARR_0_URL: http://radarr.servarr.svc.cluster.local:7878
      UN_RADARR_0_PATHS_0: /data/torrents
      UN_PARALLEL: "1"
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "0755"

# hostname, port and gateway come from appset-servarr.yaml; annotations are tpl'd, so homepage {{VARS}} are escaped
route:
  app:
    annotations:
      gethomepage.dev/enabled: 'true'
      gethomepage.dev/group: 'Downloads'
      gethomepage.dev/name: 'Unpackerr'
      gethomepage.dev/icon: 'unpackerr.png'
      gethomepage.dev/description: 'Archive extractor'
      gethomepage.dev/weight: '200'
