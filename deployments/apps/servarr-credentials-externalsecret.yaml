apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: servarr-credentials
  namespace: servarr
  annotations:
    # before the workloads that read it: ArgoCD waits for it to be healthy (ESO has filled the Secret)
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: servarr-credentials
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: bazarr-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: bazarr-api-key
    - secretKey: jellyfin-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: jellyfin-api-key
    - secretKey: plex-token
      remoteRef:
        key: servarr/servarr-credentials
        property: plex-token
    - secretKey: prowlarr-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: prowlarr-api-key
    - secretKey: qbittorrent-password
      remoteRef:
        key: servarr/servarr-credentials
        property: qbittorrent-password
    - secretKey: qbittorrent-username
      remoteRef:
        key: servarr/servarr-credentials
        property: qbittorrent-username
    - secretKey: radarr-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: radarr-api-key
    - secretKey: seerr-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: seerr-api-key
    - secretKey: sonarr-api-key
      remoteRef:
        key: servarr/servarr-credentials
        property: sonarr-api-key
