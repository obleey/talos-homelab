apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: servarr-apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - name: autopulse
          - name: bazarr
            port: 6767
          - name: byparr
          - name: clonarr
            port: 6060
          - name: jellyfin
            port: 8096
          - name: plex
            port: 32400
          - name: prowlarr
            port: 9696
          - name: qbittorrent
            port: 8080
            host: qb
          - name: radarr
            port: 7878
          - name: scraparr
          - name: seerr
            port: 5055
          - name: sonarr
            port: 8989
          - name: unpackerr
            port: 5656
          - name: watchstate
            port: 8080
  template:
    metadata:
      name: "{{.name}}"
      namespace: argocd
      labels:
        argocd.argoproj.io/managed-by: talos-cluster
      annotations:
        link.argocd.argoproj.io/external-link: "{{if .port}}https://{{.host | default .name}}.talos-cluster.local.obleey.com{{end}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: https://bjw-s-labs.github.io/helm-charts
          chart: app-template
          targetRevision: 5.3.0
          helm:
            valueFiles:
              - "$values/deployments/apps/{{.name}}/{{.name}}-values.yaml"
            # an element with a port gets its service port and gateway route from here
            values: |
              {{- if .port }}
              service:
                app:
                  controller: main
                  ports:
                    http:
                      port: {{ .port }}
              route:
                app:
                  parentRefs:
                    - name: traefik-gateway
                      namespace: traefik
                      sectionName: websecure
                  hostnames:
                    - {{ .host | default .name }}.talos-cluster.local.obleey.com
                  rules:
                    - backendRefs:
                        - name: {{ .name }}
                          port: {{ .port }}
              {{- end }}
        - repoURL: https://github.com/obleey/talos-homelab
          targetRevision: HEAD
          ref: values
          path: "deployments/apps/{{.name}}"
          directory:
            exclude: "{app.yaml,{{.name}}-values.yaml}"
      destination:
        server: https://kubernetes.default.svc
        namespace: servarr
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
