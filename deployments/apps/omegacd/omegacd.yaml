# OmegaCD control plane: manages Docker hosts (helion) as remote Hosts over SSH.
# Upstream manifest: https://github.com/obleey/omegacd/blob/main/deploy/kubernetes.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: omegacd
  namespace: omegacd
  labels: { app.kubernetes.io/name: omegacd }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omegacd
  namespace: omegacd
  labels: { app.kubernetes.io/name: omegacd }
spec:
  replicas: 1 # SQLite: one controller per database, never scale up
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: omegacd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: omegacd }
    spec:
      containers:
        - name: omegacd
          image: ghcr.io/obleey/omegacd:0.1.0-rc.5
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # work dir on the volume: an empty work dir makes OmegaCD restore (recreate) every Application
            - { name: OMEGACD_WORKDIR, value: /data/work }
            - { name: OMEGACD_LOCAL_HOST, value: "false" }
            - { name: OMEGACD_TRUSTED_PROXIES, value: "10.244.0.0/16" }
            - name: OMEGACD_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: omegacd-keys, key: webhook-secret } }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: keys, mountPath: /etc/omegacd, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omegacd }
        - name: keys
          secret:
            secretName: omegacd-keys
            defaultMode: 0400
            items:
              - { key: age.key, path: age.key }
              - { key: known_hosts, path: known_hosts }
---
apiVersion: v1
kind: Service
metadata:
  name: omegacd
  namespace: omegacd
  labels: { app.kubernetes.io/name: omegacd }
spec:
  selector: { app.kubernetes.io/name: omegacd }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: omegacd
  namespace: omegacd
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/pod-selector: 'app.kubernetes.io/name=omegacd'
    gethomepage.dev/group: 'Infrastructure'
    gethomepage.dev/name: 'OmegaCD'
    gethomepage.dev/icon: 'argo-cd.png'
    gethomepage.dev/description: 'GitOps for Docker Compose hosts'
    gethomepage.dev/weight: '140'
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "omegacd.talos-cluster.local.obleey.com"
  rules:
    - backendRefs:
        - name: omegacd
          port: 8080
