apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/netbirdio/helm-charts
      chart: netbird-operator
      targetRevision: 0.8.0
      helm:
        releaseName: netbird-operator
        valueFiles:
          - $values/deployments/infrastructure/netbird/netbird-values.yaml
    - repoURL: https://github.com/obleey/talos-homelab
      targetRevision: HEAD
      ref: values
      path: deployments/infrastructure/netbird
      directory:
        exclude: "{app.yaml,netbird-values.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
