apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-google-oauth
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: grafana-google-oauth
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: client_id
      remoteRef:
        key: monitoring/grafana-google-oauth
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: monitoring/grafana-google-oauth
        property: client_secret
