apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kps-grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: kps-grafana
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: admin-password
      remoteRef:
        key: monitoring/kps-grafana
        property: admin-password
    - secretKey: admin-user
      remoteRef:
        key: monitoring/kps-grafana
        property: admin-user
