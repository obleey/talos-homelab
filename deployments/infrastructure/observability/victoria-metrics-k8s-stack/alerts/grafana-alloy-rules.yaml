apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  alloy-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: alloy
        folder: Observability
        interval: 1m
        rules:

          - uid: alloy-service-down
            title: Grafana Alloy Service Down
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'label_replace(kube_daemonset_status_number_unavailable{namespace="monitoring", daemonset="alloy"}, "workload", "$1", "daemonset", "(.*)") or label_replace(kube_deployment_status_replicas_unavailable{namespace="monitoring", deployment="alloy-blackbox"}, "workload", "$1", "deployment", "(.*)")'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "observability-overview"
              __panelId__: "4"
              summary: "Grafana Alloy down ({{ $labels.workload }})"
              description: "{{ $values.A.Value }} {{ $labels.workload }} pod(s) unavailable; logs or blackbox probes are not being collected."
            isPaused: false
