apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-external-secrets-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  external-secrets-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: external-secrets
        folder: Infrastructure
        interval: 1m
        rules:

          - uid: external-secret-not-ready
            title: ExternalSecret Not Syncing
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # the scrape overwrites namespace with ESO's own; the ExternalSecret's is exported_namespace
                  expr: 'max by (exported_namespace, name) (externalsecret_status_condition{condition="Ready", status="False"})'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "ExternalSecret {{ $labels.exported_namespace }}/{{ $labels.name }} not syncing"
              description: "ESO can't refresh it from OpenBao: OpenBao sealed or unreachable, or a key missing in secret/{{ $labels.exported_namespace }}. The existing Secret is kept until it syncs again."
            isPaused: false
