apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-argocd-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  argocd-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: argocd
        folder: Infrastructure
        interval: 1m
        rules:

          - uid: argocd-app-out-of-sync
            title: ArgoCD App Out Of Sync
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'argocd_app_info{sync_status="OutOfSync"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 15m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "106"
              summary: "ArgoCD app out of sync ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has been OutOfSync for 15 minutes. Dest: {{ $labels.dest_namespace }}."
            isPaused: false

          - uid: argocd-app-sync-failed
            title: ArgoCD App Sync Failed
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'increase(argocd_app_sync_total{phase!="Succeeded",dry_run="false"}[10m]) > 0'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 0s
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "73"
              summary: "ArgoCD app sync failed ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} had a failed sync in the last 10 minutes (phase: {{ $labels.phase }})."
            isPaused: false

          - uid: argocd-app-degraded
            title: ArgoCD App Degraded
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'argocd_app_info{health_status="Degraded"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "105"
              summary: "ArgoCD app degraded ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has been Degraded for 5 minutes. Dest: {{ $labels.dest_namespace }}."
            isPaused: false

          - uid: argocd-app-missing
            title: ArgoCD App Missing
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'argocd_app_info{health_status="Missing"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 0s
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "105"
              summary: "ArgoCD app missing ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has resources that are Missing from the cluster. Dest: {{ $labels.dest_namespace }}."
            isPaused: false

          - uid: argocd-app-not-healthy
            title: ArgoCD App Not Healthy
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'argocd_app_info{health_status!~"Healthy|Progressing|Suspended"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 15m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "105"
              summary: "ArgoCD app not healthy ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has been {{ $labels.health_status }} for 15 minutes. Dest: {{ $labels.dest_namespace }}."
            isPaused: false

          - uid: argocd-app-stuck-progressing
            title: ArgoCD App Stuck Progressing
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # Not Healthy ignores Progressing (normal during rollouts); a stuck rollout or a
                  # cert renewal that never finishes stays Progressing forever without this
                  expr: 'argocd_app_info{health_status="Progressing"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 2h
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "105"
              summary: "ArgoCD app stuck Progressing ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has been Progressing for over 2 hours. Find the resource with: argocd app get {{ $labels.name }} -o tree | grep -v Healthy. Dest: {{ $labels.dest_namespace }}."
            isPaused: false

          - uid: argocd-cluster-connection-error
            title: ArgoCD Cluster Connection Error
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); status is 1 when connected
                  expr: >-
                    (1 - argocd_cluster_connection_status) > 0
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD cannot reach cluster {{ $labels.server }}"
              description: "ArgoCD has lost its connection to {{ $labels.server }}. Syncs targeting this cluster fail until it recovers."
            isPaused: false

          - uid: argocd-git-fetch-failures
            title: ArgoCD Git Fetch Failures
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); counter only appears after the first failure
                  expr: >-
                    sum by (repo) (rate(argocd_git_fetch_fail_total[5m])) > 0
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD failing to fetch {{ $labels.repo }}"
              description: "The repo server cannot fetch {{ $labels.repo }}, so syncs and manifest generation are blocked. Check GitHub reachability and repo credentials."
            isPaused: false

          - uid: argocd-high-grpc-error-rate
            title: ArgoCD High gRPC Error Rate
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); % of failing gRPC calls per component, max 2.5% seen over 7d
                  expr: >-
                    100 * sum by (job) (rate(grpc_server_handled_total{job=~"argocd-.*", grpc_code=~"Internal|Unavailable|DeadlineExceeded|ResourceExhausted|Aborted|Unknown"}[5m])) / sum by (job) (rate(grpc_server_handled_total{job=~"argocd-.*"}[5m])) > 5
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD {{ $labels.job }} gRPC error rate above 5%"
              description: "{{ $labels.job }} is failing {{ $values.A.Value | printf \"%.1f\" }}% of gRPC requests. The API server or repo server is degraded."
            isPaused: false

          - uid: argocd-repo-server-pending
            title: ArgoCD Repo Server Too Many Pending Requests
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); max 3 seen over 7d
                  expr: >-
                    argocd_repo_pending_request_total > 50
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD repo server has {{ $values.A.Value }} pending requests"
              description: "The repo server is backed up generating manifests, so syncs will lag. Check repo-server CPU and memory."
            isPaused: false

          - uid: argocd-slow-git-operations
            title: ArgoCD Repo Server Slow Git Operations
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); p95 seconds, max 18.9s seen over 7d
                  expr: >-
                    histogram_quantile(0.95, sum by (repo, le) (rate(argocd_git_request_duration_seconds_bucket[5m]))) > 30
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD git operations slow for {{ $labels.repo }}"
              description: "p95 git request duration for {{ $labels.repo }} is {{ $values.A.Value | printf \"%.0f\" }}s (threshold 30s). Check network latency to GitHub."
            isPaused: false

          - uid: argocd-slow-reconciliation
            title: ArgoCD Application Controller Slow Reconciliation
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # from awesome-prometheus-alerts (ci-cd/argocd); p95 seconds, max 16s seen over 7d
                  expr: >-
                    histogram_quantile(0.95, sum by (le) (rate(argocd_app_reconcile_bucket[5m]))) > 60
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 10m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              summary: "ArgoCD app reconciliation is slow"
              description: "p95 app reconciliation takes {{ $values.A.Value | printf \"%.0f\" }}s (threshold 60s). The application controller may be overloaded."
            isPaused: false

          - uid: argocd-app-autosync-disabled
            title: ArgoCD App Auto-Sync Disabled
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'argocd_app_info{autosync_enabled="false"} == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 1h
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "75"
              summary: "ArgoCD app auto-sync disabled ({{ $labels.name }})"
              description: "App {{ $labels.name }} in project {{ $labels.project }} has had auto-sync disabled for over 1 hour. This may indicate a manual intervention that was not re-enabled."
            isPaused: false

          - uid: argocd-not-running
            title: ArgoCD Application Controller Down
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'absent(argocd_app_info) == 1'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [0]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "qPkgGHg7k"
              __panelId__: "75"
              summary: "ArgoCD application controller is down"
              description: "No argocd_app_info metrics are being received. The ArgoCD application controller may be down or metrics scraping has failed."
            isPaused: false
