apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-apps-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  apps-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: apps
        folder: Apps
        interval: 1m
        rules:

          - uid: servarr-app-down
            title: Servarr App Down
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'kube_deployment_status_replicas_available{namespace="servarr", deployment!~"plex|jellyfin"}'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "becuowssfebcwa"
              __panelId__: "2"
              summary: "App pod down ({{ $labels.deployment }})"
              description: "Deployment {{ $labels.deployment }} has had 0 available replicas for 5 minutes."
            isPaused: false

          - uid: media-server-down
            title: Media Server Down
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'kube_deployment_status_replicas_available{namespace="servarr", deployment=~"plex|jellyfin"}'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: critical
            annotations:
              __dashboardUid__: "becuowssfebcwa"
              __panelId__: "12"
              summary: "Media server pod down ({{ $labels.deployment }})"
              description: "{{ $labels.deployment }} has had 0 available replicas for 5 minutes."
            isPaused: false

          - uid: scraparr-service-unreachable
            title: Arr App API Unreachable
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  expr: 'scraparr_services_up'
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [1]
                        type: lt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: OK
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              __dashboardUid__: "becuowssfebcwa"
              __panelId__: "2"
              summary: "Arr app API unreachable ({{ $labels.alias }})"
              description: "Scraparr cannot reach the {{ $labels.alias }} API. The pod may be running but the app is unresponsive."
            isPaused: false

          - uid: forgejo-backup-stale
            title: Forgejo Backup Stale
            condition: threshold
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  datasource:
                    type: prometheus
                    uid: prometheus
                  # Seconds since the forgejo-backup CronJob (restic to the Storage Box, daily at 03:20) last succeeded.
                  # A missing metric means the CronJob never succeeded or is gone, so NoData alerts.
                  expr: time() - max(kube_cronjob_status_last_successful_time{namespace="forgejo", cronjob="forgejo-backup"})
                  instant: true
                  refId: A
              - refId: threshold
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: "-100"
                model:
                  conditions:
                    - evaluator:
                        params: [172800]
                        type: gt
                      operator:
                        type: and
                      query:
                        params: [A]
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: "-100"
                  expression: A
                  refId: threshold
                  type: threshold
            noDataState: Alerting
            execErrState: Alerting
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "forgejo backup stale"
              description: "No successful restic backup of Forgejo for over 2 days ({{ $values.A.Value | printf \"%.0f\" }}s). See the logs of the last forgejo-backup job in the forgejo namespace."
            isPaused: false
