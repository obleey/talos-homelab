apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Kubernetes
data:
  k8s-container-logs.json: |
    {
      "title": "Kubernetes Logs",
      "uid": "k8s-container-logs",
      "description": "Pod log browser for Kubernetes workloads",
      "editable": true,
      "schemaVersion": 39,
      "version": 7,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "tags": [
        "kubernetes",
        "logs",
        "victorialogs"
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "definition": "{namespace=~\".+\"}",
            "query": {
              "field": "namespace",
              "query": "{namespace=~\".+\"}",
              "refId": "A",
              "type": "fieldValue"
            },
            "refresh": 2,
            "sort": 1,
            "multi": false,
            "includeAll": true,
            "allValue": ".+",
            "current": {}
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "victorialogs"
            },
            "definition": "{namespace=~\"$namespace\"}",
            "query": {
              "field": "pod",
              "query": "{namespace=~\"$namespace\"}",
              "refId": "A",
              "type": "fieldValue"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {}
          },
          {
            "name": "severity",
            "label": "Severity",
            "type": "custom",
            "description": "Case-insensitive; apps disagree on INFO/info/Warning/WARN",
            "query": "error : error|err|fatal|crit|critical,warn : warn|warning,info : info,debug : debug|trace",
            "multi": false,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "search",
            "label": "Search (regex)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Log volume by level",
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 0,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal"
                }
              },
              "unit": "short"
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "error" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
              { "matcher": { "id": "byName", "options": "warn" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }] },
              { "matcher": { "id": "byName", "options": "info" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
              { "matcher": { "id": "byName", "options": "debug" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
              { "matcher": { "id": "byName", "options": "unknown" }, "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "gray" } }] }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "right",
              "calcs": ["sum"]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"} | filter level:~\"(?i)^($severity)$\" | filter ~\"(?i)$search\" | format if (level:=\"\") \"unknown\" as level | format \"<lc:level>\" as level | replace_regexp (\"^(warning)$\", \"warn\") at level | replace_regexp (\"^(err|fatal|crit|critical)$\", \"error\") at level | replace_regexp (\"^trace$\", \"debug\") at level | stats by (_time:$__interval, level) count() as value",
              "refId": "A",
              "legendFormat": "{{level}}",
              "queryType": "statsRange"
            }
          ]
        },
        {
          "id": 2,
          "type": "logs",
          "title": "Logs",
          "gridPos": {
            "h": 22,
            "w": 24,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "options": {
            "showLabels": false,
            "showCommonLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"} | filter level:~\"(?i)^($severity)$\" | filter ~\"(?i)$search\"",
              "refId": "A"
            }
          ]
        }
      ]
    }
