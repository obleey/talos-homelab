# How this namespace reads OpenBao (secret/argocd/*): ESO logs in with this SA's token via Kubernetes auth,
# role "argocd" (policy argocd-read). OpenBao checks the token with a TokenReview made with that same token,
# hence system:auth-delegator. Same three docs in every namespace with secrets; only the namespace changes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: openbao-reader-argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-reader
    namespace: argocd
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: argocd
  annotations:
    # before the ExternalSecrets (-1) that use it
    argocd.argoproj.io/sync-wave: "-2"
    # on a fresh cluster ESO's CRDs don't exist yet when this is first synced
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: https://openbao.local.obleey.com:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: argocd
          serviceAccountRef:
            name: openbao-reader
