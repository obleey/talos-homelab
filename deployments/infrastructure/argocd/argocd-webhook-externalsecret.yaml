apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-webhook
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    # argocd-secret belongs to the chart; ArgoCD only reads the webhook HMAC secret from it, so merge the key in
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: webhook.github.secret
      remoteRef:
        key: argocd/argocd-webhook
        property: github-secret
