apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/pod-selector: 'app.kubernetes.io/name=argocd-server'
    gethomepage.dev/group: 'Infrastructure'
    gethomepage.dev/name: 'ArgoCD'
    gethomepage.dev/icon: 'argo-cd.png'
    gethomepage.dev/description: 'GitOps controller'
    gethomepage.dev/weight: '100'
    gethomepage.dev/widget.type: 'argocd'
    gethomepage.dev/widget.url: 'https://argocd.talos-cluster.local.obleey.com'
    gethomepage.dev/widget.key: '{{HOMEPAGE_VAR_ARGOCD_TOKEN}}'
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "argocd.talos-cluster.local.obleey.com"
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80