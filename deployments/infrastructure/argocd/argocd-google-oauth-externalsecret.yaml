apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-google-oauth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: openbao
  target:
    name: argocd-google-oauth
    creationPolicy: Owner
    deletionPolicy: Retain  # OpenBao sealed or the key gone: keep the last good Secret
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  # one entry per key, not dataFrom, so the key names stay in git for scripts/lint.py
  data:
    - secretKey: client-secret
      remoteRef:
        key: argocd/argocd-google-oauth
        property: client-secret
