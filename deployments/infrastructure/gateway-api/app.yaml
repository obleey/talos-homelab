# Gateway API CRDs (standard channel). Traefik chart >= 43 no longer ships them.
# No prune: deleting a CRD deletes every Gateway/HTTPRoute with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api
    targetRevision: v1.7.0
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system # unused, the CRDs are cluster-scoped
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
