apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  cron: "0 2 * * *"
  task: snapshot
  retain: 7
  concurrency: 2
  groups:
    - default
  labels: {}
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  cron: "0 3 * * 0"
  task: backup
  retain: 4
  concurrency: 1
  groups:
    - default
  labels: {}
---
# opt-in per PVC (label recurring-job-group.longhorn.io/daily-backup: enabled), e.g. Forgejo
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "30 3 * * *"
  task: backup
  retain: 14
  concurrency: 1
  groups:
    - daily-backup
  labels: {}
