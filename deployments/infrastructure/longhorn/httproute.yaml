apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/group: 'Infrastructure'
    gethomepage.dev/name: 'Longhorn'
    gethomepage.dev/icon: 'longhorn.png'
    gethomepage.dev/description: 'Distributed storage'
    gethomepage.dev/weight: '120'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - "longhorn.talos-cluster.local.obleey.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: longhorn-frontend
          port: 80
          weight: 1
