# Same checks as .githooks/pre-commit, so Renovate PRs and web edits are covered too.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install pyyaml
      - run: scripts/lint.py
      - run: scripts/test_lint.py
      - uses: azure/setup-helm@v5
      # every chart-based app renders the way ArgoCD will render it (no cluster access needed)
      - run: scripts/render-check.py
