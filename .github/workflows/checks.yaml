# Same checks as .githooks/pre-commit, so Renovate PRs and web edits are covered too.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install pyyaml
      - run: scripts/lint.py
      - run: scripts/test_lint.py
      - uses: azure/setup-helm@v5
      # every chart-based app renders the way ArgoCD will render it (no cluster access needed)
      - run: scripts/render-check.py
      # needs repo secret SLACK_BOT_TOKEN (the bot token Grafana uses); skipped while it's unset
      - if: failure() && env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: "#monitoring"
            text: ":x: checks failed on ${{ github.repository }}"
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: ":x: talos-homelab checks failed"
              - type: section
                fields:
                  - type: mrkdwn
                    text: "*Branch*\n`${{ github.head_ref || github.ref_name }}`"
                  - type: mrkdwn
                    text: "*By*\n${{ github.actor }}"
                  - type: mrkdwn
                    text: "*Commit*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>"
                  - type: mrkdwn
                    text: "*Event*\n${{ github.event_name }}"
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: View run
                    url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
